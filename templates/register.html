<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | Nexventory</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
    <div class="register-container">
        <div class="register-form">
            <h2>Daftar Akun Baru</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form action="{{ url_for('auth.register') }}" method="POST" onsubmit="return validateForm()">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">Nama Depan</label>
                        <input type="text" id="first_name" name="first_name" required 
                               class="form-control" placeholder="Nama depan"
                               value="{{ first_name }}">
                    </div>
                    <div class="form-group">
                        <label for="last_name">Nama Belakang</label>
                        <input type="text" id="last_name" name="last_name" 
                               class="form-control" placeholder="Nama belakang"
                               value="{{ last_name }}">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required
                           class="form-control" placeholder="Pilih username"
                           value="{{ username }}">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required
                           class="form-control" placeholder="contoh@email.com"
                           value="{{ email }}">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" name="password" required
                               class="form-control" placeholder="Minimal 8 karakter" 
                               onkeyup="checkPasswordStrength(this.value)">
                        <button class="btn btn-outline-secondary" type="button" 
                                onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength mt-2">
                        <div class="strength-meter" id="password-strength-meter"></div>
                    </div>
                    <small class="text-muted">Kekuatan password: <span id="password-strength-text">Lemah</span></small>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Konfirmasi Password</label>
                    <div class="input-group">
                        <input type="password" id="confirm_password" name="confirm_password" required
                               class="form-control" placeholder="Ketik ulang password">
                        <button class="btn btn-outline-secondary" type="button" 
                                onclick="togglePassword('confirm_password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div id="password-match" class="mt-1" style="height: 20px;"></div>
                </div>
            
                
                <button type="submit" class="btn btn-primary btn-register">
                    Daftar Sekarang
                </button>
            </form>
            
            <div class="login-link mt-3">
                Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk di sini</a>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script>
        // Toggle password visibility
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = field.nextElementSibling.querySelector('i');
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        // Check password strength
        function checkPasswordStrength(password) {
            let strength = 0;
            const meter = document.getElementById('password-strength-meter');
            const text = document.getElementById('password-strength-text');
            
            // Check length
            if (password.length >= 8) strength++;
            
            // Check for numbers
            if (password.match(/([0-9])/)) strength++;
            
            // Check for special characters
            if (password.match(/([!,%,&,@,#,$,^,*,?,_,~])/)) strength++;
            
            // Check for both lowercase and uppercase
            if (password.match(/([a-z].*[A-Z])|([A-Z].*[a-z])/)) strength++;
            
            // Update the meter and text
            const strengthPercent = (strength / 4) * 100;
            meter.style.width = strengthPercent + '%';
            
            // Update colors and text
            if (strength <= 1) {
                meter.style.backgroundColor = '#dc3545';
                text.textContent = 'Lemah';
                text.className = 'text-danger';
            } else if (strength === 2) {
                meter.style.backgroundColor = '#ffc107';
                text.textContent = 'Sedang';
                text.className = 'text-warning';
            } else if (strength === 3) {
                meter.style.backgroundColor = '#28a745';
                text.textContent = 'Kuat';
                text.className = 'text-success';
            } else {
                meter.style.backgroundColor = '#198754';
                text.textContent = 'Sangat Kuat';
                text.className = 'text-success fw-bold';
            }
            
            // Check password match
            checkPasswordMatch();
        }
        
        // Check if passwords match
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const matchDiv = document.getElementById('password-match');
            
            if (confirmPassword === '') {
                matchDiv.innerHTML = '';
                return;
            }
            
            if (password === confirmPassword) {
                matchDiv.innerHTML = '<span class="text-success"><i class="fas fa-check-circle"></i> Password cocok</span>';
            } else {
                matchDiv.innerHTML = '<span class="text-danger"><i class="fas fa-times-circle"></i> Password tidak cocok</span>';
            }
        }
        
        // Form validation
        function validateForm() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const terms = document.getElementById('terms');
            
            if (password !== confirmPassword) {
                alert('Password dan konfirmasi password tidak cocok!');
                return false;
            }
            
            if (!terms.checked) {
                alert('Anda harus menyetujui Syarat & Ketentuan untuk melanjutkan.');
                return false;
            }
            
            return true;
        }
        
        // Check password match on confirm password field change
        document.getElementById('confirm_password').addEventListener('keyup', checkPasswordMatch);
    </script>
</body>
</html>
